server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip сжатие для ускорения загрузки
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Кэширование статичных ассетов Vite (JS, CSS, картинки)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA роутинг: перенаправление всех путей на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Защита от бесконечного цикла редиректов
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Обработка favicon и robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Обработка 50x ошибок
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
